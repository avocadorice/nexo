[project]
name = "nexo"
version = "0.1.0"
description = "Traceable, durable chargeback intake and file delivery"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary,pool]>=3.2,<4",
  "boto3>=1.36,<2",
  "paramiko>=3.5,<5",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "pyyaml>=6,<7"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[project.scripts]
nexo = "nexo.cli:main"
