apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: simulator-data
  namespace: card-network
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 10Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator
  namespace: card-network
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: simulator}
  template:
    metadata:
      labels: {app: simulator}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: simulator
          image: nexo:local
          imagePullPolicy: IfNotPresent
          command: [python, -m, nexo.cli, simulator]
          ports:
            - {name: sftp, containerPort: 2222}
          env:
            - {name: SIM_ROOT, value: /data}
            - {name: SIM_HOST_KEY, value: /run/secrets/ssh_host_key}
            - {name: SIM_PORT, value: "2222"}
            - {name: SIM_MODE, value: normal}
          envFrom:
            - secretRef: {name: simulator-secrets}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: host-key, mountPath: /run/secrets, readOnly: true}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            tcpSocket: {port: sftp}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: simulator-data}
        - name: host-key
          secret:
            secretName: simulator-host-key
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: simulator
  namespace: card-network
spec:
  selector: {app: simulator}
  ports:
    - {name: sftp, port: 2222, targetPort: sftp}
